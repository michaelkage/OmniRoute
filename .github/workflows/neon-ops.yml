name: Neon Persistence Operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Neon operation to run on the backend"
        required: true
        type: choice
        options: [ensure, snapshot, restore]
        default: snapshot
      confirm_restore:
        description: "Type RESTORE to permit restoring a missing local SQLite database"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: neon-ops-production
  cancel-in-progress: false

jobs:
  neon:
    name: Neon ${{ inputs.operation }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate restore confirmation
        if: inputs.operation == 'restore'
        env:
          CONFIRM: ${{ inputs.confirm_restore }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "RESTORE" ]; then
            echo "::error::Restore is destructive. Re-run with confirm_restore=RESTORE."
            exit 1
          fi

      - name: Run Neon operation on backend VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OMNIROUTE_NEON_PERSISTENCE: "1"
          OMNIROUTE_NEON_SNAPSHOT_RETENTION: "12"
          DATA_DIR: ${{ secrets.DATA_DIR }}
          OPERATION: ${{ inputs.operation }}
          CONFIRM_RESTORE: ${{ inputs.confirm_restore }}
          OMNIROUTE_APP_DIR: ${{ secrets.OMNIROUTE_APP_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          envs: DATABASE_URL,OMNIROUTE_NEON_PERSISTENCE,OMNIROUTE_NEON_SNAPSHOT_RETENTION,DATA_DIR,OPERATION,CONFIRM_RESTORE,OMNIROUTE_APP_DIR
          script: |
            set -euo pipefail
            if [ -z "${DATABASE_URL:-}" ]; then
              echo "::error::DATABASE_URL is not configured in GitHub Actions secrets."
              exit 1
            fi

            APP_ROOT="${OMNIROUTE_APP_DIR:-$(npm root -g)/omniroute}"
            SCRIPT="$APP_ROOT/scripts/neon/persistence.mjs"
            if [ ! -f "$SCRIPT" ]; then
              echo "::error::Neon helper not found at $SCRIPT"
              echo "Set OMNIROUTE_APP_DIR to the installed OmniRoute package root."
              exit 1
            fi

            export DATABASE_URL OMNIROUTE_NEON_PERSISTENCE OMNIROUTE_NEON_SNAPSHOT_RETENTION
            if [ -n "${DATA_DIR:-}" ]; then export DATA_DIR; fi

            case "$OPERATION" in
              ensure)
                node "$SCRIPT" ensure
                ;;
              snapshot)
                node "$SCRIPT" ensure
                node "$SCRIPT" snapshot
                ;;
              restore)
                if [ "$CONFIRM_RESTORE" != "RESTORE" ]; then
                  echo "::error::Restore confirmation missing."
                  exit 1
                fi
                pm2 stop omniroute
                restart_pm2() { pm2 start omniroute; }
                trap restart_pm2 EXIT
                node "$SCRIPT" restore
                restart_pm2
                trap - EXIT
                ;;
              *)
                echo "::error::Unsupported operation: $OPERATION"
                exit 1
                ;;
            esac
            echo "Neon operation '$OPERATION' completed."
